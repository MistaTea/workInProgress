name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  typecheck-and-build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Generate Prisma client
        run: pnpm --filter @ba-workbench/database db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
