services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ba_workbench
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_API_BASE_URL: /api
      INTERNAL_API_BASE_URL: http://localhost:4000/api
      PUBLIC_WEB_BASE_URL: http://localhost:3000
      DEFAULT_ORGANISATION_NAME: My BA Workspace
      DEFAULT_OWNER_NAME: Senior Business Analyst
      DEFAULT_OWNER_EMAIL: owner@ba-workbench.local
    volumes:
      - ..:/workspaces/workInProgress:cached
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
